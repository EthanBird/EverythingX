name: Publish GIF and ICO/CUR Wave C evidence

on:
  push:
    branches: [main]
    paths:
      - "tools/scaffold_gif_ico_wave_c.py"
      - "tools/templates/gif_ico_*.rs"
      - "tools/templates/gif_render_capsule.rs"
      - "benchmarks/capability-bench/src/main.rs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gif-ico-wave-c
  cancel-in-progress: true

jobs:
  measure-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate bootstrap data while the new baseline is pending
        run: python3 tools/validate_repository.py --allow-performance-baseline-lag

      - name: Prove generated Wave C source is current
        run: python3 tools/scaffold_gif_ico_wave_c.py --check

      - name: Prove every Capsule builds after copy-out
        run: python3 tools/check_capsule_independence.py --cargo

      - name: Test Kernel and protocol
        run: cargo test --locked --manifest-path kernel/Cargo.toml

      - name: Test every Adapter through runnable defaults
        run: python3 tools/test_adapters.py

      - name: Measure and publish the controlled performance baseline
        run: python3 tools/benchmark_capsules.py --publish-baseline

      - name: Rebuild evidence links and derived registries
        run: |
          python3 tools/scaffold_gif_ico_wave_c.py
          python3 tools/build_performance_harness.py
          python3 tools/build_support_matrix.py
          python3 tools/sync_edge_weights.py

      - name: Enforce the final strict repository gate
        run: |
          python3 tools/validate_repository.py
          python3 tools/scaffold_gif_ico_wave_c.py --check
          python3 tools/build_performance_harness.py --check
          python3 tools/build_support_matrix.py --check
          python3 tools/sync_edge_weights.py --check

      - name: Commit controlled edge weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capsules registry benchmarks/capability-bench
          if git diff --cached --quiet; then
            echo "Performance evidence is already current."
          else
            git commit -m "Record GIF and ICO/CUR performance weights"
            git push
          fi
